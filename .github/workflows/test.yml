name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://test-user:test-password@127.0.0.1:5432/micopesa_test
      TEST_DATABASE_ADMIN_URL: postgresql://test-user:test-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test-user
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test-user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm ci --prefix apps/web
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: ignore
